<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>drydock</title>
  <!-- A hull, and the same stroke is a tick. The product is a thing lifted out
       of the water so it can be checked, and a mark that says checked. One
       shape, both meanings; nothing in it that stops reading at 16 pixels. -->
  <rect width="64" height="64" rx="15" fill="#162742"/>
  <path d="M15 21 H49 L42 41 H22 Z" fill="none" stroke="#5b8ddb"
        stroke-width="4.2" stroke-linejoin="round"/>
  <path d="M23 30 l 6.5 7.5 L 46 17" fill="none" stroke="#ffffff"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 47 h12" stroke="#5b8ddb" stroke-width="3.4" stroke-linecap="round" opacity=".55"/>
</svg>
